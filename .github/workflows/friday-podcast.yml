name: friday-podcast

on:
  schedule:
    # THURSDAY, for a Friday episode. The pipeline takes a day: a pick made on
    # day D is written by the routine at 08:00 UTC on D+1, checked at 11:00,
    # and published about 11:25 UTC — so the pick has to run the day before
    # the drop. Episode 96 was picked on a Friday and published on Saturday,
    # which is what this fixes. Thursday 11:00 UTC also leaves hours of slack
    # for GitHub, which has lately started this schedule four to six hours late.
    - cron: '0 11 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync

      - name: Pick trending paper and open Issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # The pick stages its paper's full text in the private papers
          # repository, where the writer routine reads it; GH_PAT needs
          # Contents: Read and write there.
          GH_PAT: ${{ secrets.GH_PAT }}
          PAPERS_REPO: ${{ vars.PAPERS_REPO || 'RaymondRuff/sciencetldr-papers' }}
          # A paywalled top pick is asked for at once, with its deadline and
          # runner-up, rather than whenever the next sweep happens to run.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PDF_REQUEST_TO: ${{ secrets.PDF_REQUEST_TO }}
        run: uv run python scripts/select_friday_paper.py
