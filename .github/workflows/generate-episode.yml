name: generate-episode

# Turns podcast-pending Issues into review PRs carrying a finished episode.
# Merging the PR drops the mp3 into inbox/, which fires the publish workflow.
#
# Two schedules:
#   - daily: the full sweep. It stages every waiting paper it can get in the
#     private papers repository for the writer routine, emails one PDF request
#     for each paper nobody can get, and synthesises any checked routine
#     script on main. A checked script landing on main also starts a sweep.
#   - 05:17 UTC: the same sweep, timed for PDF windows (see pdf_window.py).
#     A window closes at 9 pm Pacific (04:00 or 05:00 UTC); this run opens the
#     runner-up and stages it before the writer routine starts at 08:00. Off
#     the hour, because GitHub delays on-the-hour schedules the most.
#   - 07:28 UTC: the same again, half an hour before the writer. A window
#     closes at 05:00 UTC in winter, which leaves the 05:17 sweep only minutes
#     of slack — and GitHub routinely starts a schedule hours late. Two
#     chances make a Monday or Friday drop far likelier to hold. Sweeps cost
#     nothing and are idempotent, so running one twice is free.
#   - every 30 min: a mailbox check for PDFs you've emailed back. It uses only
#     the standard library and stops before installing anything if the inbox
#     has nothing new, so a quiet poll costs seconds.

on:
  issues:
    types: [opened, labeled]
  push:
    branches: [main]
    paths:
      - 'inbox/pdfs/**.pdf'
      # The checker routine landing a checked script. Without this the episode
      # waited for the 14:00 sweep, which GitHub's scheduler has been starting
      # up to six hours late.
      - 'generated/routine/*.script.json'
  schedule:
    - cron: '0 14 * * *'      # full sweep
    - cron: '17 5 * * *'      # full sweep that closes expired PDF windows
    - cron: '28 7 * * *'      # second chance at that, just before the writer
    - cron: '*/30 * * * *'    # mailbox poll
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to generate (blank = sweep all eligible)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: generate-episode
  cancel-in-progress: false

jobs:
  generate:
    # On `issues` events, react only to a new pending Issue — never to the
    # pipeline's own labels (needs-pdf, episode-in-review, ...), each of which
    # would otherwise start another run and cascade through the queue.
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'opened' &&
        contains(join(github.event.issue.labels.*.name, ','), 'podcast-pending')) ||
      (github.event.action == 'labeled' &&
        github.event.label.name == 'podcast-pending')
    runs-on: ubuntu-latest
    env:
      POLL: ${{ github.event.schedule == '*/30 * * * *' }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PDF_REQUEST_TO: ${{ secrets.PDF_REQUEST_TO }}
      PDF_SENDER_ALLOWLIST: ${{ secrets.PDF_SENDER_ALLOWLIST }}
      # The private repository that paper bundles live in. Reaching it needs
      # GH_PAT with Contents: Read and write on it; without that the run falls
      # back to fetching text over HTTP, as it did before bundles existed.
      PAPERS_REPO: ${{ vars.PAPERS_REPO || 'RaymondRuff/sciencetldr-papers' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check mailbox for emailed PDFs
        id: mailbox
        run: python3 scripts/pdf_mailbox.py check

      - name: Install uv
        if: env.POLL != 'true' || steps.mailbox.outputs.found == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        if: env.POLL != 'true' || steps.mailbox.outputs.found == 'true'
        run: uv sync

      - name: Decide whether this run makes audio
        id: audio
        if: env.POLL != 'true' || steps.mailbox.outputs.found == 'true'
        run: uv run python scripts/generate_episode.py --needs-audio
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Only when there is a script to synthesise. On 2026-11-11 a runner could
      # not resolve the Ubuntu mirrors at all, and this step burned its whole
      # thirty-minute budget on a sweep that had nothing to encode. `update`
      # fails fast so a DNS outage is a minute, not ten; `install` keeps its
      # retries for a merely slow mirror.
      - name: Install ffmpeg
        if: steps.audio.outputs.needed == 'true'
        timeout-minutes: 30
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=1 &&
               sudo apt-get install -y -o Acquire::Retries=3 ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Generate episode draft(s)
        if: env.POLL != 'true' || steps.mailbox.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_EPISODES_PER_RUN: ${{ vars.MAX_EPISODES_PER_RUN || '3' }}
          PYTHONUNBUFFERED: '1'   # real timestamps on log lines
          # Auto-publish: with the AUTO_PUBLISH variable set to 'true', the
          # daily sweep (and a manual run with no issue named) merges the oldest
          # waiting draft PR — one a day. Any other value keeps the manual merge.
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          PUBLISH_SLOT: ${{ github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          ISSUE: ${{ inputs.issue }}
        run: |
          PUBLISH=""
          if [ "$AUTO_PUBLISH" = "true" ] && [ "$PUBLISH_SLOT" = "true" ]; then
            PUBLISH="--publish-next"
          fi
          if [ "$POLL" = "true" ]; then
            uv run python scripts/generate_episode.py --mailbox-only
          elif [ -n "$ISSUE" ]; then
            uv run python scripts/generate_episode.py --issue "$ISSUE"
          else
            uv run python scripts/generate_episode.py $PUBLISH
          fi
