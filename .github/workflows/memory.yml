name: memory

# Keeps the show's cross-episode memory current: one card per published
# episode, plus the running-threads file the hosts draw on when recording.
#
# Manual only. The routine in prompts/routine_memory.md does this on the
# Claude subscription and has done it well (episodes 85-93 in one pass), so
# the API path is kept as a deliberate fallback rather than something that
# fires on every publish. It failed its last five automatic runs anyway: once
# on the API spend limit, then repeatedly on max_tokens while rewriting a
# threads file that had grown to ten sections.

on:
  workflow_dispatch:
    inputs:
      rebuild_threads:
        description: 'Rewrite threads.md even if no new cards were built'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memory
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Update memory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python scripts/memory.py update
          if [ "${{ inputs.rebuild_threads }}" = "true" ]; then
            uv run python scripts/memory.py threads
          fi

      # Always: a run that dies partway has usually written some cards, and
      # without this they are rebuilt and thrown away on the next attempt —
      # which is what every failed run so far did.
      - name: Commit memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/
          if git diff --cached --quiet; then
            echo "No memory changes to commit"
            exit 0
          fi
          git commit -m "memory: update cards and threads [skip ci]"
          git push
