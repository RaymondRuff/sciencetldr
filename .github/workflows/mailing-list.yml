name: mailing-list

# Writes the addresses in the DIGEST_RECIPIENTS secret into
# list/subscribers.txt in the private papers repository, so the roster can be
# read without waiting for a digest to go out. A secret cannot be read back,
# which is the whole reason the list moved; this is how you check nobody was
# lost on the way.
#
# It sends no email, and it never prints an address: this repository is public
# and so are its Actions logs. The addresses live in the private papers
# repository and nowhere else. Safe to run as often as you like — it folds in
# whatever the secret holds, keeps everyone already on the file, and leaves
# anyone who has unsubscribed off it.

on:
  # Off the hour and off the half hour, on purpose. GitHub delays scheduled
  # runs most at those minutes, and it drops them outright under load: the
  # mailbox poll's `*/30` cron ran six times on 2026-11-13 instead of
  # forty-eight, with gaps of four and five hours, which is why a subscriber
  # could write in and hear nothing all evening.
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Answer whoever has written in. Cheap: the mailbox check is standard
  # library, and nothing else is installed unless there is a welcome to send.
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PAPERS_REPO: ${{ vars.PAPERS_REPO || 'RaymondRuff/sciencetldr-papers' }}
      DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the mailbox for subscribe and unsubscribe mail
        id: mailbox
        run: python3 scripts/pdf_mailbox.py list

      - uses: astral-sh/setup-uv@v3
        if: steps.mailbox.outputs.welcome == 'true'
        with:
          enable-cache: true

      - name: Sync dependencies
        if: steps.mailbox.outputs.welcome == 'true'
        run: uv sync

      # Their mail is labelled only once this has gone, so a failure here
      # costs one poll, not the confirmation.
      - name: Welcome new subscribers with the latest digest
        if: steps.mailbox.outputs.welcome == 'true'
        run: uv run python scripts/pdf_mailbox.py welcome

  # Run by hand only: folding the secret in is a migration step, not something
  # to repeat every quarter hour.
  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Standard library only, so there is nothing to install.
      - name: Fold the secret into the list
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PAPERS_REPO: ${{ vars.PAPERS_REPO || 'RaymondRuff/sciencetldr-papers' }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: python3 scripts/mailing_list.py sync
