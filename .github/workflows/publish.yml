name: publish

on:
  push:
    branches: [main]
    paths:
      - 'inbox/**.mp3'
      - 'inbox/**.m4a'
      - 'inbox/**.mp4a'
      - 'inbox/**.wav'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        timeout-minutes: 30
        # On 2026-11-04 the runner's Ubuntu mirror served this at about 50 kB/s
        # and the step took well over ten minutes. Slow is fine; a failure is
        # retried, and apt is skipped when the image already has ffmpeg.
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
               sudo apt-get install -y -o Acquire::Retries=3 ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Cache whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-hf-cache-v1

      - name: Publish episode(s)
        env:
          # No ANTHROPIC_API_KEY: show notes come from the routine, beside the
          # audio, or from metadata. Publishing cannot spend on the API. To
          # bring back Sonnet-written notes, add the key here and set
          # SHOW_NOTES_VIA_API: 'true'.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # Publishing an episode discards its paper bundle: the papers
          # repository is a staging area for other people's copyrighted work,
          # not an archive.
          GH_PAT: ${{ secrets.GH_PAT }}
          PAPERS_REPO: ${{ vars.PAPERS_REPO || 'RaymondRuff/sciencetldr-papers' }}
        run: uv run python scripts/publish_episode.py

      - name: Commit episode + feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml inbox/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "publish: new episode(s) [skip ci]"
          git push

      # Memory is not updated here. The routine in prompts/routine_memory.md
      # writes the cards and threads on the Claude subscription; memory.yml
      # is the API fallback and is manual-only, so nothing dispatches it.
